services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    image: krs-chatbot:latest
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_PATH: /app/data/krs.db
      INVOICES_EXCEL: /app/data/invoices.xlsx
    ports:
      - "8000:8000"
    volumes:
      - krs_data:/app/data

volumes:
  qdrant_storage:
  krs_data:
